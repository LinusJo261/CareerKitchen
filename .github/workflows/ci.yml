name: application-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests/research -v
      - run: python -m scripts.benchmark_matching_allocator --output .local/matching-allocation-benchmark/ci --threshold-cases 300 --check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.11.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: career_kitchen
          POSTGRES_PASSWORD: ci-only-random-isolated-password
          POSTGRES_DB: career_kitchen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career_kitchen -d career_kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://career_kitchen:ci-only-random-isolated-password@127.0.0.1:5432/career_kitchen_test
      TEST_DATABASE_URL: postgresql+psycopg://career_kitchen:ci-only-random-isolated-password@127.0.0.1:5432/career_kitchen_test
      AUTH_MODE: local
      ALLOW_DEV_AUTH: "true"
      DEV_JWT_SECRET: ci-only-signing-secret-for-isolated-tests-42
      AUDIT_HMAC_KEY: ci-only-audit-secret-for-isolated-tests-42
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: python scripts/validate_migrations.py
      - run: ruff format --check --quiet apps/api scripts migrations
      - run: ruff check apps/api scripts migrations
      - run: mypy apps/api/app scripts migrations
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest --cov=apps/api/app --cov-report=term-missing
      - run: python scripts/export_openapi.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci --prefix packages/api-client
      - run: npm run check:generated --prefix packages/api-client
      - run: npm run typecheck --prefix packages/api-client
      - run: npm test --prefix packages/api-client
