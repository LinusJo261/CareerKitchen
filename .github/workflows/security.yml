name: dependency-and-secret-review
on:
  pull_request:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: python -m pip install --upgrade pip
      - run: pip-audit --skip-editable
      - name: Check tracked secrets
        run: python scripts/check_secrets.py

